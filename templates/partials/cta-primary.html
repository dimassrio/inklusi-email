<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="border-collapse:separate; mso-table-lspace:0pt; mso-table-rspace:0pt;">
    <tr>
        <td align="center" bgcolor="{{colors.primary}}" style="background-color:{{colors.primary}}; border-radius:4px; mso-padding-alt:12px 16px 12px 16px; text-align:center;">
            <a href="{{url}}" target="_blank" style="display:block; padding:12px 16px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:12px; color:#ffffff; text-decoration:none; text-align:center;">{{label}}</a>
        </td>
    </tr>
</table>
